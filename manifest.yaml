# ops-extension protocol manifest — single declarative source for the
# extension's wire protocol (tools + session variables + lifecycle). Handler
# and resolver bindings stay in code (tools.go / variables.go).
id: ops
version: 0.1.0
lifecycle: [deleted]
variables:
  - name: sandbox-id
    scope: session
    description: Container ID of the session sandbox.
  - name: sandbox-status
    scope: session
    description: Status of the session sandbox.
tools:
  - name: sandbox-run
    description: Run a shell command in the session sandbox. The workspace is synced to the repo bookmark head first (repo files refreshed; sandbox-only files kept).
    input_schema:
      type: object
      properties:
        command: { type: string }
        workdir: { type: string }
        timeout_ms: { type: integer, description: "Synchronous wait ceiling in milliseconds (default 10000). If the command does not finish within this window it is backgrounded and a completion notice is sent to the chat." }
      required: [command]
  - name: sandbox-read
    description: Read a file from the session sandbox filesystem (synced to repo first).
    input_schema:
      type: object
      properties:
        path: { type: string }
      required: [path]
  - name: sandbox-write
    description: Write a file into the session sandbox filesystem (no sync first — never clobbers in-progress edits).
    input_schema:
      type: object
      properties:
        path: { type: string }
        content: { type: string }
      required: [path, content]
  - name: sandbox-edit
    description: Replace or insert lines in a sandbox file by line numbers (synced to repo first).
    input_schema:
      type: object
      properties:
        start_line: { type: integer }
        end_line: { type: integer }
        path: { type: string }
        content: { type: string }
      required: [path, start_line, end_line]
  - name: sandbox-job-list
    description: List jobs (commands) in the session sandbox.
    input_schema:
      type: object
      properties: {}
  - name: sandbox-job-output
    description: Read output of a sandbox job (supports offset/limit/grep).
    input_schema:
      type: object
      properties:
        job_id: { type: string }
        start: { type: integer }
        end: { type: integer }
        grep: { type: string }
      required: [job_id]
  - name: sandbox-job-wait
    description: Wait for a sandbox job to finish.
    input_schema:
      type: object
      properties:
        job_id: { type: string }
        timeout_ms: { type: integer }
      required: [job_id]
  - name: sandbox-job-stdin
    description: Send stdin data to a running sandbox job.
    input_schema:
      type: object
      properties:
        job_id: { type: string }
        data: { type: string }
      required: [job_id, data]
  - name: sandbox-job-kill
    description: Kill a sandbox job.
    input_schema:
      type: object
      properties:
        job_id: { type: string }
      required: [job_id]
  - name: sandbox-port
    description: Copy a file from the sandbox into the session's repo (bookmark moves; the change syncs back on the next sandbox tool call).
    input_schema:
      type: object
      properties:
        sandbox_path: { type: string }
        repo_path: { type: string }
        message: { type: string }
      required: [sandbox_path, repo_path]
  - name: container-build
    description: Build a container image from a Containerfile in the repo using the remote buildkit builder.
    input_schema:
      type: object
      properties:
        dockerfile_path: { type: string }
        tag: { type: string }
        image_tag: { type: string, description: "Optional semantic version for the pushed image reference (e.g. v0.0.1). When omitted the tag defaults to the source bookmark (a floating tag)." }
        context: { type: string }
        no_cache: { type: boolean }
      required: [dockerfile_path, tag]
  - name: container-deploy
    description: Deploy a container image as a Kubernetes deployment (with optional nested resource requests/limits).
    input_schema:
      type: object
      properties:
        image: { type: string }
        name: { type: string }
        resources:
          type: object
          properties:
            requests:
              type: object
              properties:
                cpu: { type: string }
                memory: { type: string }
            limits:
              type: object
              properties:
                cpu: { type: string }
                memory: { type: string }
      required: [image]
  - name: image-list
    description: List container images in the OCI registry.
    input_schema:
      type: object
      properties: {}
  - name: helm-install
    description: Install (or upgrade) a Helm chart from the session's repo checkout (chart_path relative to repo root) as a release in the cluster namespace. Values override chart defaults. Runs async; returns once installed or failed.
    input_schema:
      type: object
      properties:
        release_name: { type: string }
        chart_path: { type: string }
        values: { type: object }
      required: [release_name]
  - name: helm-list
    description: List Helm releases in the cluster namespace.
    input_schema:
      type: object
      properties: {}
  - name: helm-status
    description: Show the status of one Helm release.
    input_schema:
      type: object
      properties:
        release_name: { type: string }
      required: [release_name]
  - name: helm-uninstall
    description: Uninstall a Helm release.
    input_schema:
      type: object
      properties:
        release_name: { type: string }
      required: [release_name]
  - name: package-publish
    description: "Publish the repo checkout as a package. Runs the protocol's official CLI inside a containerfile build (buildkit, no image export). Protocols: npm,pypi,cargo,rubygems,helm,nuget,maven,go,hex,composer,generic,conan,pub,swift. Manifest-driven protocols (npm/pypi/cargo/...) read name+version from the package manifest; go/hex/composer/maven/swift/generic need explicit name+version (+file for generic)."
    input_schema:
      type: object
      properties:
        protocol: { type: string }
        org: { type: string }
        repo: { type: string }
        bookmark: { type: string }
        name: { type: string }
        version: { type: string }
        file: { type: string }
        dockerfile_path: { type: string }
      required: [protocol]
  - name: list-registry-packages
    description: List packages and versions stored in the artifact registry (all protocols).
    input_schema:
      type: object
      properties:
        protocol: { type: string }
        name: { type: string }
  - name: list-containerfile-templates
    description: List built-in Containerfile/build templates.
    input_schema:
      type: object
      properties: {}
  - name: pull-git-repo
    description: Clone a remote git repository into jj-server local storage (org 'external').
    input_schema:
      type: object
      properties:
        git_url: { type: string }
        org: { type: string }
      required: [git_url]
